name: Review this project
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    uses: ./.github/workflows/review.yml
