name: OpenCode free reviewer runtime
description: Trusted source collection, isolated free inference, and deterministic publication.
inputs:
  phase:
    description: One of prepare, infer, publish.
    required: true
  pr_number:
    description: PR number for manual dispatch.
    default: ''
outputs:
  eligible:
    description: Whether this event needs review.
    value: ${{ steps.runtime.outputs.eligible }}
  number:
    description: Validated PR number.
    value: ${{ steps.runtime.outputs.number }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.10'
    - name: Install pinned reviewer dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile
    - id: runtime
      name: Run trusted reviewer phase
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REVIEWER_PHASE: ${{ inputs.phase }}
        REVIEWER_PR_NUMBER: ${{ inputs.pr_number }}
        REVIEWER_REPO: ${{ github.repository }}
        REVIEWER_ACTOR: ${{ github.actor }}
        REVIEWER_EVENT: ${{ github.event_name }}
        REVIEWER_EVENT_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        data="$RUNNER_TEMP/reviewer-data"
        mkdir -p "$data"
        case "$REVIEWER_PHASE" in
          prepare)
            bun src/cli.ts prepare --repo "$REVIEWER_REPO" --pr "$REVIEWER_PR_NUMBER" --actor "$REVIEWER_ACTOR" --event-name "$REVIEWER_EVENT" --event-file "$GITHUB_EVENT_PATH" --event-id "$REVIEWER_EVENT_ID" --out "$data/bundle.json"
            ;;
          infer)
            bun src/cli.ts build
            bun src/cli.ts infer --input "$data/bundle.json" --out "$data/result.json"
            ;;
          publish)
            bun src/cli.ts publish --input "$data/bundle.json" --result "$data/result.json"
            ;;
          *) exit 2 ;;
        esac
