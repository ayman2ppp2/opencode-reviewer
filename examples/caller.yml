# Replace the all-zero SHA placeholder with a reviewed central repository commit.
name: OpenCode reviewer

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      egress_profile:
        description: Select one inference connection.
        type: choice
        default: configured
        options: [configured, direct, laptop, android]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name != 'issue_comment' || github.event.issue.pull_request
    uses: ayman2ppp2/opencode-reviewer/.github/workflows/review.yml@0000000000000000000000000000000000000000
    with:
      pr_number: ${{ github.event.inputs.pr_number || '' }}
      egress_profile: ${{ github.event.inputs.egress_profile || 'configured' }}
    secrets:
      REVIEWER_LAPTOP_RELAY_URL: ${{ secrets.REVIEWER_LAPTOP_RELAY_URL }}
      REVIEWER_LAPTOP_RELAY_KEY: ${{ secrets.REVIEWER_LAPTOP_RELAY_KEY }}
      REVIEWER_ANDROID_RELAY_URL: ${{ secrets.REVIEWER_ANDROID_RELAY_URL }}
      REVIEWER_ANDROID_RELAY_KEY: ${{ secrets.REVIEWER_ANDROID_RELAY_KEY }}
